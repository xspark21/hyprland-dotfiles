[mgr]
ratio          = [ 1, 3, 4 ]
linemode       = "size"
sort_dir_first = true

[opener]

mpv = [
    { run = 'mpv %s', orphan = true, desc = "mpv" }
]

vlc = [
    { run = 'vlc %s', orphan = true, desc = "vlc" }
]

image = [
    { run = 'feh --scale-down --borderless --image-bg black %s', orphan = true, desc = "feh" }
]

video = [
    { run = 'mpv %s', orphan = true, desc = "mpv" }
]

pdf = [
    { run = 'env GSK_RENDERER=cairo zathura %s', orphan = true, desc = "zathura" }
]

[open]
prepend_rules = [
    { url = "*.{png,jpg,jpeg,webp,gif,svg}", use = "image" },
    { url = "*.{mp4,mkv,avi,mov,webm}", use = ["mpv", "vlc"] },
    { url = "*.pdf", use = "pdf" },

    # Respaldo por mime
    { mime = "image/*", use = "image" },
    { mime = "video/*", use = ["mpv", "vlc"] },
    { mime = "application/pdf", use = "pdf" }
]

[plugin]
prepend_previewers = [
    { url = "*/target/*", run = "archive" },
    { url = "*/.venv/*", run = "archive" }
]
